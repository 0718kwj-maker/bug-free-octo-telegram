<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스틱맨 무기 대결 - 프리미엄 에디션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow-btn { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); transition: all 0.2s ease; }
        .glow-btn:hover { box-shadow: 0 0 30px rgba(99, 102, 241, 0.8); transform: translateY(-2px); }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 메인 컨테이너 -->
    <div id="app" class="w-full max-w-4xl glass-panel rounded-3xl shadow-2xl overflow-hidden flex flex-col min-h-[640px]">
        
        <!-- 상단 헤더 바 -->
        <header class="bg-slate-900/90 px-6 py-4 flex justify-between items-center border-b border-slate-800/80">
            <div class="flex items-center space-x-3">
                <span class="text-3xl animate-bounce">⚔️</span>
                <div>
                    <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-amber-400 via-rose-500 to-indigo-400 bg-clip-text text-transparent">스틱맨 무기 대결</h1>
                    <div class="flex items-center space-x-1.5 text-xs text-slate-400">
                        <span>👤</span> <span id="user-nickname-display" class="font-bold text-indigo-400">비회원</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-4 text-sm font-bold">
                <div class="flex items-center space-x-1.5 bg-slate-950/80 px-3.5 py-2 rounded-2xl border border-slate-800 shadow-inner">
                    <span class="text-amber-400 animate-pulse">🪙</span>
                    <span id="user-gold" class="text-amber-300">1000</span>G
                </div>
                <div class="flex items-center space-x-1.5 bg-slate-950/80 px-3.5 py-2 rounded-2xl border border-slate-800 shadow-inner">
                    <span class="text-yellow-400">🏆</span>
                    <span id="user-trophy" class="text-yellow-300">0</span> 점
                </div>
                <button onclick="openAuthModal()" id="auth-btn" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-xs font-bold transition shadow-lg glow-btn">계정 변경</button>
            </div>
        </header>

        <!-- 메인 화면 영역 -->
        <main id="main-content" class="flex-1 p-6 flex flex-col justify-center items-center z-10 relative pointer-events-auto">
            <!-- 초기 로그인 / 회원가입 화면 (실행 시 무조건 맨 처음 표시) -->
            <div id="auth-screen" class="text-center space-y-6 w-full max-w-md glass-panel p-8 rounded-3xl border border-slate-700/60 shadow-2xl relative z-30 pointer-events-auto">
                <div class="space-y-2">
                    <h2 class="text-3xl font-black tracking-tight text-amber-400">🔥 전설의 결투 시작</h2>
                    <p class="text-slate-400 text-sm">닉네임과 비밀번호를 입력해 계정을 생성하세요!</p>
                </div>
                
                <div class="space-y-3 relative z-40 pointer-events-auto">
                    <input type="text" id="start-username" placeholder="사용할 닉네임 입력" class="w-full bg-slate-950/90 border border-slate-700/80 rounded-2xl px-4 py-3.5 text-white font-bold focus:outline-none focus:border-indigo-500 text-sm shadow-inner transition relative z-40 pointer-events-auto">
                    <input type="text" id="start-password" placeholder="비밀번호 입력 (보임)" class="w-full bg-slate-950/90 border border-slate-700/80 rounded-2xl px-4 py-3.5 text-white font-bold focus:outline-none focus:border-indigo-500 text-sm shadow-inner transition relative z-40 pointer-events-auto">
                </div>

                <div class="flex space-x-3 pt-2 relative z-40 pointer-events-auto">
                    <button type="button" onclick="handleStartLogin()" class="flex-1 py-3.5 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-bold text-sm shadow-lg glow-btn transition cursor-pointer pointer-events-auto">로그인</button>
                    <button type="button" onclick="handleStartSignup()" class="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-500 rounded-2xl font-bold text-sm shadow-lg transition cursor-pointer pointer-events-auto">계정 만들기</button>
                </div>
            </div>

            <!-- 로비 화면 (로그인 완료 후 표시) -->
            <div id="lobby-screen" class="text-center space-y-6 w-full max-w-md hidden relative z-30 pointer-events-auto">
                <div class="space-y-2">
                    <h2 class="text-3xl font-black tracking-tight bg-gradient-to-r from-amber-300 to-rose-400 bg-clip-text text-transparent">전투를 준비하세요!</h2>
                    <p class="text-slate-400 text-sm">강력한 무기를 장착하고 아레나를 지배하세요!</p>
                </div>
                
                <div class="glass-panel p-4 rounded-2xl border border-slate-700/60 flex items-center justify-between shadow-xl relative z-40 pointer-events-auto">
                    <div class="text-left">
                        <div class="text-xs text-slate-400">장착 중인 무기</div>
                        <div id="lobby-weapon-name" class="text-lg font-black text-amber-400">초음속 단검 (Lv.1)</div>
                    </div>
                    <button type="button" onclick="openShop()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2.5 rounded-xl font-bold text-sm shadow-lg glow-btn transition transform active:scale-95 cursor-pointer pointer-events-auto">
                        무기 상점 🛒
                    </button>
                </div>

                <div class="space-y-3 relative z-40 pointer-events-auto">
                    <button type="button" onclick="startBattle()" class="w-full py-4 bg-gradient-to-r from-rose-600 via-purple-600 to-indigo-600 hover:opacity-90 rounded-2xl font-black text-xl shadow-xl glow-btn transition transform active:scale-95 flex items-center justify-center space-x-2 cursor-pointer pointer-events-auto">
                        <span>🤖 AI 싱글 결투 시작</span>
                    </button>
                    <button type="button" onclick="openRankedLobby()" class="w-full py-4 bg-gradient-to-r from-amber-600 via-orange-600 to-yellow-500 hover:opacity-90 rounded-2xl font-black text-xl shadow-xl glow-btn transition transform active:scale-95 flex items-center justify-center space-x-2 cursor-pointer pointer-events-auto">
                        <span>🏆 전 세계 랭크전 (리얼 유저 전용)</span>
                    </button>
                    <button type="button" onclick="openMultiplayerLobby()" class="w-full py-4 bg-gradient-to-r from-indigo-600 via-blue-600 to-teal-600 hover:opacity-90 rounded-2xl font-black text-xl shadow-xl glow-btn transition transform active:scale-95 flex items-center justify-center space-x-2 cursor-pointer pointer-events-auto">
                        <span>👥 실시간 1:1 멀티플레이어 (방 만들기)</span>
                    </button>
                    <button type="button" onclick="openShop()" class="w-full py-3.5 bg-slate-800/80 hover:bg-slate-700/80 rounded-2xl font-bold text-sm border border-slate-700 transition shadow cursor-pointer pointer-events-auto">
                        무기 관리 및 업그레이드
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- 모달 컨테이너 (상점 등) -->
    <div id="modal-container" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 pointer-events-auto">
        <div id="modal-content" class="glass-panel border border-slate-700 w-full max-w-2xl max-h-[85vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden relative z-50 pointer-events-auto">
        </div>
    </div>

    <!-- 인증 모달 -->
    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 pointer-events-auto">
        <div class="glass-panel border border-slate-700 w-full max-w-md rounded-3xl shadow-2xl p-6 space-y-4 relative z-50 pointer-events-auto">
            <h3 class="font-black text-xl text-amber-400">🔐 계정 생성 및 로그인</h3>
            <p class="text-xs text-slate-400">사용할 닉네임과 비밀번호를 입력해주세요!</p>
            <div class="space-y-3">
                <input type="text" id="auth-username" placeholder="사용할 닉네임 입력" class="w-full bg-slate-950/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-white font-bold focus:outline-none focus:border-indigo-500 text-sm shadow-inner relative z-50 pointer-events-auto">
                <input type="text" id="auth-password" placeholder="비밀번호 입력 (보임)" class="w-full bg-slate-950/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-white font-bold focus:outline-none focus:border-indigo-500 text-sm shadow-inner relative z-50 pointer-events-auto">
            </div>
            <div class="flex space-x-2 pt-2 relative z-50 pointer-events-auto">
                <button type="button" onclick="handleLocalLogin()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-bold text-sm shadow-lg glow-btn cursor-pointer pointer-events-auto">로그인</button>
                <button type="button" onclick="handleLocalSignup()" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 rounded-2xl font-bold text-sm shadow-lg cursor-pointer pointer-events-auto">계정 만들기</button>
                <button type="button" onclick="closeAuthModal()" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 rounded-2xl font-bold text-sm border border-slate-700 cursor-pointer pointer-events-auto">취소</button>
            </div>
        </div>
    </div>

    <!-- 알림 메시지 모달 -->
    <div id="alert-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 pointer-events-auto">
        <div class="glass-panel border border-slate-700 w-full max-w-sm rounded-3xl shadow-2xl p-6 text-center space-y-4 relative z-50 pointer-events-auto">
            <h3 id="alert-title" class="font-black text-lg text-amber-400">알림</h3>
            <p id="alert-message" class="text-sm text-slate-300"></p>
            <button type="button" onclick="closeAlertModal()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-bold text-sm glow-btn cursor-pointer pointer-events-auto">확인</button>
        </div>
    </div>

    <!-- 랭크전 로비 모달 추가 -->
    <div id="ranked-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 pointer-events-auto">
        <div class="glass-panel border border-slate-700 w-full max-w-md rounded-3xl shadow-2xl p-6 text-center space-y-4 relative z-50 pointer-events-auto">
            <h3 class="font-black text-xl text-amber-400">🏆 전 세계 실시간 랭크전 매칭</h3>
            <p id="ranked-status-text" class="text-sm text-slate-300">리얼 유저 상대를 찾고 있습니다...</p>
            <div class="py-4">
                <div class="w-12 h-12 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
            </div>
            <button type="button" onclick="cancelRankedMatch()" class="w-full py-3 bg-rose-600 hover:bg-rose-500 rounded-2xl font-bold text-sm glow-btn cursor-pointer pointer-events-auto">매칭 취소</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'stickman-duel-default';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');

        let db, auth;
        let userId = 'local-user-' + Math.random().toString(36).substring(2, 8);

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                signInWithCustomToken(auth, __initial_auth_token).catch(() => signInAnonymously(auth));
            } else {
                signInAnonymously(auth);
            }
            onAuthStateChanged(auth, (user) => {
                if (user) userId = user.uid;
            });
        } catch (e) {
            console.log('Firebase init fallback:', e);
        }

        // 30가지 무기 및 완벽하게 균형 잡힌 밸런스 설정 (딜 너프 적용)
        const WEAPONS = [
            { id: 'dagger', name: '초음속 단검', type: 'melee', damage: 6, speed: 0.35, range: 45, cost: 0, color: '#38bdf8', desc: '초고속 연타와 잔상 이펙트' },
            { id: 'sword', name: '전사의 검', type: 'melee', damage: 10, speed: 0.65, range: 65, cost: 200, color: '#fbbf24', desc: '황금빛 표준 검기' },
            { id: 'katana', name: '질풍 카타나', type: 'melee', damage: 12, speed: 0.55, range: 75, cost: 500, color: '#a855f7', desc: '보라색 참격 폭풍' },
            { id: 'bow', name: '사냥꾼 활', type: 'ranged', damage: 8, speed: 0.9, range: 300, cost: 350, color: '#22c55e', desc: '초록빛 관통 화살' },

            { id: 'flamethrower', name: '화염 방사기', type: 'flame', damage: 3, speed: 0.2, range: 180, cost: 1200, color: '#ea580c', desc: '연속적인 주황색 화염 난사' },
            { id: 'scythe', name: '사신의 낫', type: 'melee', damage: 18, speed: 1.4, range: 85, cost: 1600, color: '#6366f1', desc: '남색 영혼의 광역 참격' },
            { id: 'spear', name: '철갑 창', type: 'melee', damage: 11, speed: 0.7, range: 110, cost: 900, color: '#94a3b8', desc: '은빛 돌격 찌르기' },
            { id: 'mace', name: '기사단 철퇴', type: 'melee', damage: 16, speed: 1.1, range: 60, cost: 1100, color: '#d97706', desc: '충격파를 일으키는 묵직한 타격' },
            { id: 'crossbow', name: '연발 석궁', type: 'ranged', damage: 7, speed: 0.3, range: 280, cost: 1300, color: '#06b6d4', desc: '청록색 볼트 연속 발사' },
            { id: 'axe', name: '전투 도끼', type: 'melee', damage: 15, speed: 1.0, range: 65, cost: 1000, color: '#dc2626', desc: '내려찍는 피의 파동' },
            { id: 'rapier', name: '신속의 레이피어', type: 'melee', damage: 7, speed: 0.3, range: 70, cost: 1250, color: '#e2e8f0', desc: '눈에 보이지 않는 초고속 찌르기' },
            { id: 'halberd', name: '미늘창', type: 'melee', damage: 17, speed: 1.3, range: 100, cost: 1800, color: '#84cc16', desc: '라임색 광역 회전 베기' },
            { id: 'shuriken', name: '닌자 수리검', type: 'ranged', damage: 5, speed: 0.22, range: 250, cost: 950, color: '#f43f5e', desc: '회전하는 분홍빛 표창 다발' },
            { id: 'wand', name: '정령의 지팡이', type: 'magic', damage: 13, speed: 1.0, range: 240, cost: 1400, color: '#10b981', desc: '에메랄드빛 정령 구슬' },
            { id: 'plasma', name: '플라즈마 건', type: 'ranged', damage: 18, speed: 1.1, range: 320, cost: 2200, color: '#3b82f6', desc: '파란색 고에너지 레이저' },
            { id: 'hammer', name: '거대 망치', type: 'melee', damage: 22, speed: 1.6, range: 70, cost: 2500, color: '#78716c', desc: '지면을 초토화하는 거대 해머' },
            { id: 'kunai', name: '투척 쿠나이', type: 'ranged', damage: 6, speed: 0.35, range: 220, cost: 850, color: '#a3e635', desc: '날렵한 독성 쿠나이 투척' },
            { id: 'blaster', name: '레이저 블래스터', type: 'ranged', damage: 11, speed: 0.5, range: 310, cost: 1700, color: '#ec4899', desc: '마젠타빛 광선포 발사' },
            { id: 'chakram', name: '회전 차크람', type: 'ranged', damage: 10, speed: 0.6, range: 260, cost: 1500, color: '#f59e0b', desc: '황금빛 부메랑 회전 궤도' },
            { id: 'glaive', name: '용권 글레이브', type: 'melee', damage: 16, speed: 1.1, range: 90, cost: 1900, color: '#14b8a6', desc: '청록색 회오리 바람 베기' },
            { id: 'shotgun', name: '파쇄 산탄총', type: 'ranged', damage: 20, speed: 1.3, range: 190, cost: 2400, color: '#b91c1c', desc: '근거리에서 퍼지는 산탄 폭발' },
            { id: 'dual_blades', name: '암흑 쌍검', type: 'melee', damage: 8, speed: 0.3, range: 50, cost: 1150, color: '#4f46e5', desc: '쌍검의 현란한 교차 난타' },
            { id: 'ice_staff', name: '빙결 지팡이', type: 'magic', damage: 13, speed: 1.1, range: 250, cost: 2100, color: '#0ea5e9', desc: '냉기 얼음 파편 발사' },
            { id: 'lightning_rod', name: '번개 지팡이', type: 'magic', damage: 16, speed: 1.2, range: 270, cost: 2600, color: '#eab308', desc: '찌릿한 노란색 전격 번개' },
            { id: 'hook_sword', name: '갈고리 검', type: 'melee', damage: 12, speed: 0.6, range: 65, cost: 1650, color: '#8b5cf6', desc: '보라빛 갈고리 궤적' },
            { id: 'heavy_bow', name: '컴파운드 저격활', type: 'ranged', damage: 15, speed: 1.1, range: 350, cost: 2000, color: '#15803d', desc: '강력한 고속 저격 화살' },
            { id: 'acid_gun', name: '부식성 건', type: 'flame', damage: 8, speed: 0.4, range: 200, cost: 1850, color: '#65a30d', desc: '독성 연두색 액체 분사' },
            { id: 'flintlock', name: '해적 화승총', type: 'ranged', damage: 19, speed: 1.4, range: 280, cost: 2300, color: '#b45309', desc: '구형 총기의 묵직한 탄환' },
            { id: 'excalibur', name: '전설의 성검', type: 'melee', damage: 26, speed: 1.6, range: 95, cost: 5000, color: '#fbbf24', desc: '모든 무기의 왕, 궁극의 성검 빛' }
        ];

        let gameState = {
            gold: 1200,
            trophy: 0,
            nickname: '',
            equippedWeaponId: 'dagger',
            weaponLevels: {},
            unlockedWeapons: ['dagger', 'sword'],
            tier: '브론즈'
        };

        WEAPONS.forEach(w => {
            gameState.weaponLevels[w.id] = 1;
        });

        let battleState = null;
        let gameInterval = null;
        let multiplayerUnsubscribe = null;
        let rankedQueueUnsubscribe = null;

        window.showAlert = function(title, message) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-modal').classList.remove('hidden');
        }

        window.closeAlertModal = function() {
            document.getElementById('alert-modal').classList.add('hidden');
        }

        window.openAuthModal = function() {
            document.getElementById('auth-modal').classList.remove('hidden');
        }

        window.closeAuthModal = function() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        window.handleStartLogin = function() {
            const nick = document.getElementById('start-username').value.trim();
            const pass = document.getElementById('start-password').value.trim();
            if (!nick || !pass) {
                showAlert('알림', '닉네임과 비밀번호를 모두 입력해주세요!');
                return;
            }
            gameState.nickname = nick;
            finishLogin();
        }

        window.handleStartSignup = function() {
            const nick = document.getElementById('start-username').value.trim();
            const pass = document.getElementById('start-password').value.trim();
            if (!nick || !pass) {
                showAlert('알림', '닉네임과 비밀번호를 모두 입력해주세요!');
                return;
            }
            gameState.nickname = nick;
            finishLogin();
        }

        window.handleLocalLogin = function() {
            const nick = document.getElementById('auth-username').value.trim();
            const pass = document.getElementById('auth-password').value.trim();
            if (!nick || !pass) {
                showAlert('알림', '닉네임과 비밀번호를 모두 입력해주세요!');
                return;
            }
            gameState.nickname = nick;
            closeAuthModal();
            finishLogin();
        }

            document.getElementById('ranked-modal').classList.remove('hidden');

                nickname: gameState.nickname || '용사',

                weaponLevel: gameState.weaponLevels[weapon.id],
                trophy: gameState.trophy,
                joinedAt: Date.now()
            });

            rankedQueueUnsubscribe = onSnapshot(queueRef, async (snapshot) => {
                let opponents = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.userId !== userId) {
                        opponents.push(data);
                    }
                });

                if (opponents.length > 0) {
                    opponents.sort((a, b) => a.joinedAt - b.joinedAt);
                    const matchedOpp = opponents[0];

                    if (rankedQueueUnsubscribe) {
                        rankedQueueUnsubscribe();
                        rankedQueueUnsubscribe = null;
                    }
                    await deleteDoc(myQueueDoc).catch(() => {});
                    document.getElementById('ranked-modal').classList.add('hidden');

                    const roomId = 'ranked-' + [userId, matchedOpp.userId].sort().join('-');
                    const isHost = userId < matchedOpp.userId;
                    startRankedMatch(roomId, isHost, matchedOpp);
                }
            });

        function setupMultiplayerSync() {
            if (!db) return;
            const matchRef = doc(db, 'artifacts', appId, 'public', 'data', 'matches', battleState.roomId);
            multiplayerUnsubscribe = onSnapshot(matchRef, (docSnap) => {
                if (!docSnap.exists() || !battleState) return;
                const data = docSnap.data();
                const oppKey = battleState.isHost ? 'client' : 'host';
                if (data[oppKey]) {
                    battleState.opponent.x = data[oppKey].x;
                    battleState.opponent.y = data[oppKey].y;
                    battleState.opponent.hp = data[oppKey].hp;
                    battleState.opponent.facing = data[oppKey].facing;

                    battleState.opponent.name = data[oppKey].name;
                }
            });
        }

        let keys = { left: false, right: false, attack: false, skill: false };

        function initBattleListeners() {
            window.onkeydown = (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.left = true; keys.right = false; }
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = true; keys.left = false; }
                if (e.key === ' ' || e.key === 'j' || e.key === 'J') keys.attack = true;
                if (e.key === 'k' || e.key === 'K' || e.key === 's' || e.key === 'S') keys.skill = true;
            };
            window.onkeyup = (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
                if (e.key === ' ' || e.key === 'j' || e.key === 'J') keys.attack = false;
                if (e.key === 'k' || e.key === 'K' || e.key === 's' || e.key === 'S') keys.skill = false;
            };

            // 창 포커스가 벗어나거나 마우스가 버튼을 벗어날 때 방향키가 고정되는 현상 완벽 방지
            window.onblur = () => {
                keys.left = false;
                keys.right = false;
                keys.attack = false;
                keys.skill = false;
            };

            const bindTouch = (id, keyName) => {
                const el = document.getElementById(id);
                if (!el) return;
                
                const clearAllMove = () => {
                    keys.left = false;
                    keys.right = false;
                };

                el.ontouchstart = (e) => { 
                    e.preventDefault(); 
                    if (keyName === 'left' || keyName === 'right') clearAllMove();
                    keys[keyName] = true; 
                };
                el.ontouchend = (e) => { e.preventDefault(); keys[keyName] = false; };
                el.onmousedown = (e) => { 
                    e.preventDefault(); 
                    if (keyName === 'left' || keyName === 'right') clearAllMove();
                    keys[keyName] = true; 
                };
                el.onmouseup = (e) => { e.preventDefault(); keys[keyName] = false; };
                el.onmouseleave = (e) => { keys[keyName] = false; };
            };
            bindTouch('btn-left', 'left');
            bindTouch('btn-right', 'right');
            bindTouch('btn-attack', 'attack');
            bindTouch('btn-skill', 'skill');
        }

        function removeBattleListeners() {
            window.onkeydown = null;
            window.onkeyup = null;
            window.onblur = null;
            if (multiplayerUnsubscribe) {

                multiplayerUnsubscribe = null;

            if (gameInterval) {

        function updateBattleLoop() {
            if (!battleState || battleState.isMulti) return;
            const p = battleState.player;
            const ai = battleState.ai;
            const groundY = 340;

            p.y += p.vy; p.vy += 0.6;
            if (p.y >= groundY) { p.y = groundY; p.vy = 0; }
            ai.y += ai.vy; ai.vy += 0.6;
            if (ai.y >= groundY) { ai.y = groundY; ai.vy = 0; }

            let moveSpeed = 5.0;
            // 즉각적인 입력 반영을 위한 이동 처리
            if (keys.left && !keys.right) { p.x -= moveSpeed; p.facing = -1; }
            else if (keys.right && !keys.left) { p.x += moveSpeed; p.facing = 1; }
            p.x = Math.max(40, Math.min(760, p.x));

            if (p.skillCooldown > 0) p.skillCooldown--;

            const distance = Math.abs(p.x - ai.x);
            let aiSpeed = 2.0 + (ai.level * 0.05);
            if (distance > ai.weapon.range + 25) {
                if (p.x > ai.x) { ai.x += aiSpeed; ai.facing = 1; }
                else { ai.x -= aiSpeed; ai.facing = -1; }
            } else {
                ai.facing = p.x > ai.x ? 1 : -1;
            }
            ai.x = Math.max(40, Math.min(760, ai.x));

            if (ai.attackCooldown > 0) {
                ai.attackCooldown--;
            } else if (distance <= ai.weapon.range + 35) {
                if (Math.random() < 0.15) {
                    ai.isAttacking = true;
                    ai.attackAnimTimer = 14;
                    ai.attackCooldown = Math.max(18, Math.round(ai.weapon.speed * 35));
                    triggerAttack(ai, p, false);
                }
            }
            if (ai.attackAnimTimer > 0) {
                ai.attackAnimTimer--;
                if (ai.attackAnimTimer === 0) ai.isAttacking = false;
            }

            if (keys.skill && p.skillCooldown === 0) {
                p.skillCooldown = p.skillMaxCooldown;
                triggerUniqueSkill(p, ai);
            }

            if (p.attackCooldown > 0) {
                p.attackCooldown--;
            } else if (keys.attack) {
                p.isAttacking = true;
                p.attackAnimTimer = 12;
                p.attackCooldown = Math.round(p.weapon.speed * 28);
                triggerAttack(p, ai, true);
            }
            if (p.attackAnimTimer > 0) {
                p.attackAnimTimer--;
                if (p.attackAnimTimer === 0) p.isAttacking = false;
            }

            for (let i = battleState.projectiles.length - 1; i >= 0; i--) {
                const proj = battleState.projectiles[i];
                proj.x += proj.vx;
                if (proj.y !== undefined) {
                    proj.y += proj.vy || 0;
                }
                if (proj.x < 0 || proj.x > 800 || proj.y < 0 || proj.y > 450) {
                    battleState.projectiles.splice(i, 1);
                    continue;
                }
                if (proj.isPlayer && Math.abs(proj.x - ai.x) < 35 && Math.abs(proj.y - ai.y) < 45) {
                    ai.hp = Math.max(0, ai.hp - proj.damage);
                    createExplosionEffect(ai.x, ai.y, proj.color);
                    battleState.projectiles.splice(i, 1);
                } else if (!proj.isPlayer && Math.abs(proj.x - p.x) < 35 && Math.abs(proj.y - p.y) < 45) {
                    p.hp = Math.max(0, p.hp - proj.damage);
                    createExplosionEffect(p.x, p.y, '#f43f5e');
                    battleState.projectiles.splice(i, 1);
                }
            }

            if (battleState.effects) {
                for (let i = battleState.effects.length - 1; i >= 0; i--) {
                    const eff = battleState.effects[i];
                    eff.life--;
                    if (eff.life <= 0) battleState.effects.splice(i, 1);
                }
            }

            document.getElementById('player-hp-bar').style.width = `${Math.max(0, (p.hp / p.maxHp) * 100)}%`;
            document.getElementById('player-hp-text').innerText = `${Math.ceil(Math.max(0, p.hp))}/${p.maxHp}`;
            document.getElementById('ai-hp-bar').style.width = `${Math.max(0, (ai.hp / ai.maxHp) * 100)}%`;
            document.getElementById('ai-hp-text').innerText = `${Math.ceil(Math.max(0, ai.hp))}/${ai.maxHp}`;

            const skillCdEl = document.getElementById('player-skill-cd');
            if (p.skillCooldown === 0) {
                skillCdEl.innerText = '사용 가능 (⚡)';
                skillCdEl.className = 'text-amber-400 font-bold animate-pulse';
            } else {
                skillCdEl.innerText = `${(p.skillCooldown / 60).toFixed(1)}초`;
                skillCdEl.className = 'text-slate-400 font-bold';
            }

            renderBattleCanvas();

            if (ai.hp <= 0) {
                removeBattleListeners();
                handleBattleResult(true);
            } else if (p.hp <= 0) {
                removeBattleListeners();
                handleBattleResult(false);
            }
        }

        function updateMultiplayerLoop() {
            if (!battleState || !battleState.isMulti) return;
            const p = battleState.player;
            const opp = battleState.opponent;
            const groundY = 340;

            p.y += p.vy; p.vy += 0.6;
            if (p.y >= groundY) { p.y = groundY; p.vy = 0; }

            let moveSpeed = 5.0;
            if (keys.left && !keys.right) { p.x -= moveSpeed; p.facing = -1; }
            else if (keys.right && !keys.left) { p.x += moveSpeed; p.facing = 1; }
            p.x = Math.max(40, Math.min(760, p.x));

            if (p.skillCooldown > 0) p.skillCooldown--;

            if (keys.attack && p.attackAnimTimer === 0) {
                p.isAttacking = true;
                p.attackAnimTimer = 12;
                if (Math.abs(p.x - opp.x) < p.weapon.range + 20) {
                    opp.hp = Math.max(0, opp.hp - Math.round(p.weapon.damage + (p.level - 1) * 5));
                    createExplosionEffect(opp.x, opp.y, p.weapon.color);
                }
            }
            if (p.attackAnimTimer > 0) {
                p.attackAnimTimer--;
                if (p.attackAnimTimer === 0) p.isAttacking = false;
            }

            if (keys.skill && p.skillCooldown === 0) {
                p.skillCooldown = p.skillMaxCooldown;
                opp.hp = Math.max(0, opp.hp - Math.round((p.weapon.damage * 1.2) + (p.level - 1) * 4));
                createExplosionEffect(opp.x, opp.y, p.weapon.color);
            }

            if (db) {
                const matchRef = doc(db, 'artifacts', appId, 'public', 'data', 'matches', battleState.roomId);
                const roleKey = battleState.isHost ? 'host' : 'client';
                setDoc(matchRef, {
                    [roleKey]: {
                        x: p.x, y: p.y, hp: p.hp, facing: p.facing, isAttacking: p.isAttacking,
                        name: gameState.nickname || '용사'
                    }
                }, { merge: true });
            }

            document.getElementById('player-hp-bar').style.width = `${Math.max(0, (p.hp / p.maxHp) * 100)}%`;
            document.getElementById('player-hp-text').innerText = `${Math.ceil(Math.max(0, p.hp))}/${p.maxHp}`;
            document.getElementById('ai-hp-bar').style.width = `${Math.max(0, (opp.hp / opp.maxHp) * 100)}%`;
            document.getElementById('ai-hp-text').innerText = `${Math.ceil(Math.max(0, opp.hp))}/${opp.maxHp}`;
            document.getElementById('opp-name').innerText = opp.name;

            const skillCdEl = document.getElementById('player-skill-cd');
            if (p.skillCooldown === 0) {
                skillCdEl.innerText = '사용 가능 (⚡)';
                skillCdEl.className = 'text-amber-400 font-bold animate-pulse';
            } else {
                skillCdEl.innerText = `${(p.skillCooldown / 60).toFixed(1)}초`;
                skillCdEl.className = 'text-slate-400 font-bold';
            }

            renderBattleCanvasMulti();

            if (opp.hp <= 0) {
                removeBattleListeners();
                handleBattleResult(true);
            } else if (p.hp <= 0) {
                removeBattleListeners();
                handleBattleResult(false);
            }
        }

        function triggerAttack(attacker, target, isPlayer) {
            const lvl = attacker.level;
            const dmg = Math.round(attacker.weapon.damage + (lvl - 1) * 3);
            const dist = Math.abs(attacker.x - target.x);
            const color = attacker.weapon.color;

            if (attacker.weapon.type === 'melee') {
                if (dist <= attacker.weapon.range + 20) {
                    target.hp = Math.max(0, target.hp - dmg);
                    createExplosionEffect(target.x, target.y, color);
                }
            } else if (attacker.weapon.type === 'flame') {
                for (let k = 0; k < 5; k++) {
                    battleState.projectiles.push({
                        x: attacker.x + (attacker.facing * 15),
                        y: attacker.y - 20 + (Math.random() * 20 - 10),
                        vx: attacker.facing * (6 + Math.random() * 5),
                        vy: Math.random() * 2 - 1,
                        damage: Math.max(1, Math.round(dmg / 3)),
                        isPlayer: isPlayer,
                        color: color
                    });
                }
            } else {
                battleState.projectiles.push({
                    x: attacker.x + (attacker.facing * 20),
                    y: attacker.y - 15,
                    vx: attacker.facing * 12,
                    vy: 0,
                    damage: dmg,
                    isPlayer: isPlayer,
                    color: color
                });
            }
        }

        function triggerUniqueSkill(attacker, target) {
            const lvl = attacker.level;
            const baseDmg = attacker.weapon.damage;
            let skillDmg = Math.round((baseDmg * 1.25) + (lvl - 1) * 4);
            const color = attacker.weapon.color;

            if (attacker.weapon.type === 'ranged' || attacker.weapon.type === 'magic') {
                for (let i = 0; i < 3; i++) {
                    battleState.projectiles.push({
                        x: target.x + (i * 25 - 25), y: target.y - 130,
                        vx: 0, vy: 9, damage: Math.round(skillDmg / 3),
                        isPlayer: true, color: color
                    });
                }
            } else {
                target.hp = Math.max(0, target.hp - skillDmg);
                createExplosionEffect(target.x, target.y, color);
            }
        }

        function createExplosionEffect(x, y, color) {
            if (!battleState.effects) battleState.effects = [];
            battleState.effects.push({ x, y, radius: 10, maxRadius: 45, color: color, life: 18 });
        }

        function renderBattleCanvas() {
            const canvas = document.getElementById('battle-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const p = battleState.player;
            const ai = battleState.ai;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#090d16');
            bgGrad.addColorStop(1, '#020617');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.shadowColor = '#6366f1';
            ctx.shadowBlur = 15;
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 345);
            ctx.lineTo(800, 345);
            ctx.stroke();
            ctx.shadowBlur = 0;

            if (battleState.effects) {
                battleState.effects.forEach(eff => {
                    ctx.save();
                    ctx.strokeStyle = eff.color;
                    ctx.shadowColor = eff.color;
                    ctx.shadowBlur = 12;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                    eff.radius += 2.5;
                });
            }

            const drawStickman = (entity, color, name) => {
                ctx.save();
                ctx.translate(entity.x, entity.y);
                if (entity.facing === -1) ctx.scale(-1, 1);

                ctx.strokeStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 8;
                ctx.lineWidth = 3.5;
                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.arc(0, -45, 12, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -33);
                ctx.lineTo(0, -10);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(-11, 0);
                ctx.moveTo(0, -10);
                ctx.lineTo(11, 0);
                ctx.stroke();

                if (entity.isAttacking) {
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.arc(28, -25, 32, -Math.PI * 0.75, Math.PI * 0.75);
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.moveTo(0, -25);
                ctx.lineTo(24, entity.isAttacking ? -42 : -15);
                ctx.stroke();

                ctx.restore();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(name, entity.x, entity.y - 72);
            };

            drawStickman(p, p.weapon.color, gameState.nickname || '플레이어');
            drawStickman(ai, ai.weapon.color, `AI (Lv.${ai.level})`);

            battleState.projectiles.forEach(proj => {
                ctx.save();
                ctx.fillStyle = proj.color;
                ctx.shadowColor = proj.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function renderBattleCanvasMulti() {
            const canvas = document.getElementById('battle-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const p = battleState.player;
            const opp = battleState.opponent;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#090d16');
            bgGrad.addColorStop(1, '#020617');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.shadowColor = '#6366f1';
            ctx.shadowBlur = 15;
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 345);
            ctx.lineTo(800, 345);
            ctx.stroke();
            ctx.shadowBlur = 0;

            const drawStickman = (entity, color, name, isAtk) => {
                ctx.save();
                ctx.translate(entity.x, entity.y);
                if (entity.facing === -1) ctx.scale(-1, 1);

                ctx.strokeStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 8;
                ctx.lineWidth = 3.5;
                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.arc(0, -45, 12, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -33);
                ctx.lineTo(0, -10);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(-11, 0);
                ctx.moveTo(0, -10);
                ctx.lineTo(11, 0);
                ctx.stroke();

                if (isAtk) {
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.arc(28, -25, 32, -Math.PI * 0.75, Math.PI * 0.75);
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.moveTo(0, -25);
                ctx.lineTo(24, isAtk ? -42 : -15);
                ctx.stroke();

                ctx.restore();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(name, entity.x, entity.y - 72);
            };

            drawStickman(p, p.weapon.color, gameState.nickname || '나', p.isAttacking);
            drawStickman(opp, '#f43f5e', opp.name, opp.isAttacking);
        }

        function handleBattleResult(isWin) {
            const main = document.getElementById('main-content');
            if (isWin) {
                gameState.gold += 450;
                gameState.trophy += 35;
                gameState.weaponLevels[gameState.equippedWeaponId]++;
            }

            main.innerHTML = `
                <div class="text-center space-y-6 w-full max-w-md glass-panel p-8 rounded-3xl border border-slate-700 shadow-2xl">
                    <h2 class="text-4xl font-black ${isWin ? 'text-amber-400' : 'text-rose-500'} animate-pulse">
                        ${isWin ? '🎉 전투 승리!' : '💀 패배...'}
                    </h2>
                    <p class="text-slate-300 font-bold">${isWin ? '보상 450골드 획득 및 무기 레벨업!' : '더 강력한 무기로 다시 도전하세요!'}</p>
                    <button onclick="returnToLobby()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-black text-lg shadow-xl glow-btn transition">
                        로비로 돌아가기
                    </button>
                </div>
            `;
        }

        window.returnToLobby = function() {
            document.getElementById('main-content').innerHTML = `
                <div id="lobby-screen" class="text-center space-y-6 w-full max-w-md relative z-30 pointer-events-auto">
                    <div class="space-y-2">
                        <h2 class="text-3xl font-black tracking-tight bg-gradient-to-r from-amber-300 to-rose-400 bg-clip-text text-transparent">전투를 준비하세요!</h2>
                        <p class="text-slate-400 text-sm">강력한 무기를 장착하고 아레나를 지배하세요!</p>
                    </div>
                    
                    <div class="glass-panel p-4 rounded-2xl border border-slate-700/60 flex items-center justify-between shadow-xl relative z-40 pointer-events-auto">
                        <div class="text-left">
                            <div class="text-xs text-slate-400">장착 중인 무기</div>
                            <div id="lobby-weapon-name" class="text-lg font-black text-amber-400">단검 (Lv.1)</div>
                        </div>
                        <button type="button" onclick="openShop()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2.5 rounded-xl font-bold text-sm shadow-lg glow-btn transition transform active:scale-95 cursor-pointer pointer-events-auto">
                            무기 상점 🛒
                        </button>
                    </div>

                    <div class="space-y-3 relative z-40 pointer-events-auto">
                        <button type="button" onclick="startBattle()" class="w-full py-4 bg-gradient-to-r from-rose-600 via-purple-600 to-indigo-600 hover:opacity-90 rounded-2xl font-black text-xl shadow-xl glow-btn transition transform active:scale-95 flex items-center justify-center space-x-2 cursor-pointer pointer-events-auto">
                            <span>🤖 AI 싱글 결투 시작</span>
                        </button>
                        <button type="button" onclick="openRankedLobby()" class="w-full py-4 bg-gradient-to-r from-amber-600 via-orange-600 to-yellow-500 hover:opacity-90 rounded-2xl font-black text-xl shadow-xl glow-btn transition transform active:scale-95 flex items-center justify-center space-x-2 cursor-pointer pointer-events-auto">
                            <span>🏆 전 세계 랭크전 (리얼 유저 전용)</span>
                        </button>
                        <button type="button" onclick="openMultiplayerLobby()" class="w-full py-4 bg-gradient-to-r from-indigo-600 via-blue-600 to-teal-600 hover:opacity-90 rounded-2xl font-black text-xl shadow-xl glow-btn transition transform active:scale-95 flex items-center justify-center space-x-2 cursor-pointer pointer-events-auto">
                            <span>👥 실시간 1:1 멀티플레이어 (방 만들기)</span>
                        </button>
                        <button type="button" onclick="openShop()" class="w-full py-3.5 bg-slate-800/80 hover:bg-slate-700/80 rounded-2xl font-bold text-sm border border-slate-700 transition shadow cursor-pointer pointer-events-auto">
                            무기 관리 및 업그레이드
                        </button>
                    </div>
                </div>
            `;
            updateHeaderUI();
        }
    </script>
</body>
</html>
